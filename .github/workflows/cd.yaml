name: Build Docker image to AWS ECR

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: <region>
  AWS_OIDC_AUDIENCE: sts.amazonaws.com
  AWS_CI_ROLE: arn:aws:iam::<account-id>:role/<ci-image-push-role>

  ECR_REGISTRY: <account-id>.dkr.ecr.<region>.amazonaws.com
  ECR_REPO: <namespace>/<ecr-repository>

  ECS_APP_CLUSTER: <ecs-cluster-name>
  ECS_APP_SERVICE: <ecs-cluster-service-name>
  ECS_APP_CONTAINER_NAME: <container-name>


jobs:

  build:

    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.uri }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        aws-region: ${{ env.AWS_REGION }}
        audience: ${{ env.AWS_OIDC_AUDIENCE }}
        role-to-assume: ${{ env.AWS_CI_ROLE }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push docker image to Amazon ECR
      id: build
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ env.ECR_REPO }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG codebase/rdicidr-0.1.0/.
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        echo "uri=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        aws-region: ${{ env.AWS_REGION }}
        audience: ${{ env.AWS_OIDC_AUDIENCE }}
        role-to-assume: ${{ env.AWS_CI_ROLE }}

    - name: Get Task Definition for our App Service
      run: |
        aws ecs describe-task-definition --task-definition <container-name>-td | jq '.taskDefinition' > task-definition.json

    - name: Render Amazon ECS task definition
      id: render
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      env:
        IMAGE_URI: ${{ needs.build.outputs.image }}
      with:
        task-definition: task-definition.json
        container-name: ${{ env.ECS_APP_CONTAINER_NAME }}
        image: ${{ env.IMAGE_URI }}

    - name: Deploy to Amazon ECS service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render.outputs.task-definition }}
        service: ${{ env.ECS_APP_SERVICE }}
        cluster: ${{ env.ECS_APP_CLUSTER }}
