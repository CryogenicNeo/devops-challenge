name: Build Docker image to AWS ECR

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_OIDC_AUDIENCE: sts.amazonaws.com
  AWS_CI_ROLE: arn:aws:iam::135245990211:role/GitHubActions-FSL-ECR-Image-Push

  ECR_REGISTRY: 135245990211.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: production/fsl-devops-challenge-ecr

  ECS_FSL_APP_CLUSTER: fsl-devops-challenge-cluster
  ECS_FSL_APP_SERVICE: fsl-app-td-service-0yhsf3qr
  ECS_FSL_APP_CONTAINER_NAME: fsl-app


jobs:

  build:

    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.uri }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        aws-region: ${{ env.AWS_REGION }}
        audience: ${{ env.AWS_OIDC_AUDIENCE }}
        role-to-assume: ${{ env.AWS_CI_ROLE }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push docker image to Amazon ECR
      id: build
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ env.ECR_REPO }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG codebase/rdicidr-0.1.0/.
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        echo "uri=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        aws-region: ${{ env.AWS_REGION }}
        audience: ${{ env.AWS_OIDC_AUDIENCE }}
        role-to-assume: ${{ env.AWS_CI_ROLE }}

    - name: Get Task Definition for our FSL App Service
      run: |
        aws ecs describe-task-definition --task-definition fsl-app-td | jq '.taskDefinition' > task-definition.json

    - name: Render Amazon ECS task definition
      id: render
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      env:
        IMAGE_URI: ${{ needs.build.outputs.image }}
      with:
        task-definition: task-definition.json
        container-name: ${{ env.ECS_FSL_APP_CONTAINER_NAME }}
        image: ${{ env.IMAGE_URI }}

    - name: Deploy to Amazon ECS service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render.outputs.task-definition }}
        service: ${{ env.ECS_FSL_APP_SERVICE }}
        cluster: ${{ env.ECS_FSL_APP_CLUSTER }}
